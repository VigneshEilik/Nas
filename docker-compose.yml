version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nas-academy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nas_academy
    ports:
      - "5432:5432"
    volumes:
      - nas_academy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d nas_academy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nas_academy_pgdata:
